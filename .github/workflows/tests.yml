name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: unit tests
        run: python -m pytest -q tests
      - name: tier analyses (toy, small)
        run: python src/tier_analyses.py --n-events 300 --seed 12345
      - name: tier demo and ROOT sample tools (small)
        run: |
          python src/tier_demo.py --n-events 100 --seed 12345
          python src/make_sample.py
          python src/inspect_file.py data/raw/sample_events.root --grep pt
      - name: Pythia validation (small) — normalisation must be exactly 1
        run: python src/validate_eec_pythia.py --n-events 300 --seed 12345
