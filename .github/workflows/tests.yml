# Runs the test suite on every push and pull request, in the pinned pip environment
# (requirements.txt; requirements-lock.txt records the full freeze of the toy stack).
# A failure in tests/test_tier_numbers.py means a documented number moved: fix the bug, or
# regenerate the docs and figures together with the code.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit, closure, documented-number and notebook tests
        run: python -m pytest -q
      - name: tier analyses (toy, small)
        run: python src/tier_analyses.py --n-events 300 --seed 12345
      - name: tier demo and ROOT sample tools (small)
        run: |
          python src/tier_demo.py --n-events 100 --seed 12345
          python src/make_sample.py
          python src/inspect_file.py data/raw/sample_events.root --grep pt
      - name: Pythia validation (small) — closure and normalisation must hold
        run: python src/validate_eec_pythia.py --n-events 300 --seed 12345
