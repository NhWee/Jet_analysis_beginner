# environment.yml — Jet analysis (jet reconstruction + Energy-Energy Correlators)
#
#   Create : mamba env create -f environment.yml      (or: conda env create -f environment.yml)
#   Use    : conda activate jet-eec
#   Freeze : conda env export --no-builds > environment.lock.yml   # commit this for reproducibility
#
# One unified environment works for ALL four LHC experiments (CMS/ATLAS/ALICE/LHCb).
# The per-experiment difference is only the data-access/format layer, not this env.

name: jet-eec

channels:
  - conda-forge

dependencies:
  # --- Python + core scientific stack ---
  - python=3.13          # same as the verified pip route; on 3.11 pip pulls a numpy<2 wheel of wasserstein (energyflow dep) and breaks pandas
  - numpy
  - scipy
  - pandas
  - matplotlib
  - numba                 # JIT-accelerate the O(N^2) EEC constituent-pair loop

  # --- Scikit-HEP: read data, build jets, histogram, plot ---
  - uproot                # read ROOT / NanoAOD files (no ROOT install needed)
  - awkward               # jagged / variable-length arrays (jet constituents)
  - vector                # Lorentz 4-vectors (pt, eta, phi, E)
  - hist                  # histograms
  - boost-histogram
  - mplhep                # ATLAS/CMS-style plot styling
  - particle              # PDG particle properties
  - hepunits
  - coffea                # columnar analysis framework (scales to many files)
  - xrootd                # stream open-data files over root:// without full download

  # --- Deep learning ---
  - pytorch               # CPU build; for GPU see README (pytorch-cuda)
  - scikit-learn

  # --- Event generator: installed from PyPI below (pythia8mc), NOT conda-forge pythia8 ---
  # conda-forge ships an older Pythia (8.312 in 2026-11), which generates different events
  # for the same seed, so the reproduction numbers in docs/GUIDE.md would not match.

  # --- Notebook / tooling ---
  - pytest              # tests/ ; run: python -m pytest -q tests
  - jupyterlab
  - ipykernel
  - git

  # --- Optional (uncomment if you want ROOT-native workflows) ---
  # - root                # PyROOT / RDataFrame; installs cleanly from conda-forge

  # --- pip-only extras ---
  - pip
  - pip:
      # versions pinned to match requirements.txt (the verified pip route)
      - fastjet==3.5.2.0    # scikit-hep FastJet: clustering + energy correlators (awkward interface)
      - energyflow==1.4.0   # EFPs, EFN/PFN, EMD, MOD datasets — jets + ML + correlators
      - pythia8mc==8.318.3  # Pythia 8 event generator; `import pythia8mc`
