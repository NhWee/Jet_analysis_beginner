# environment.lock.yml — exact versions of a working jet-eec environment (linux-64).
#
# Generated 2026-11-05 from `environment.yml` with micromamba 2.10.0, then verified by creating
# a fresh environment FROM THIS FILE and running the tests and the Pythia validation (numbers
# identical to the pip route, see docs/GUIDE.md).
#
#   mamba env create -f environment.lock.yml
#
# linux-64 only: conda package builds differ per platform. On macOS/Windows use environment.yml
# (or the pip route, requirements.txt). Hand edits: removed a CPU-specific virtual package
# (_x86_64-microarch-level) and pip packages that leaked in from the user site.
